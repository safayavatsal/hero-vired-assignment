apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.storeBackend }}
  labels:
    {{- include "hero-vired.labels" . | nindent 4 }}
    app.kubernetes.io/component: store-backend
spec:
  selector:
    app.kubernetes.io/component: store-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.storeBackend }}
  labels:
    {{- include "hero-vired.labels" . | nindent 4 }}
    app.kubernetes.io/component: store-backend
spec:
  replicas: {{ .Values.replicas.storeBackend }}
  selector:
    matchLabels:
      app.kubernetes.io/component: store-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "hero-vired.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: store-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: store-backend
          image: "{{ .Values.images.storeBackend.repository }}:{{ .Values.images.storeBackend.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.backendContainerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Values.services.config }}
            - secretRef:
                name: {{ include "hero-vired.secretName" . }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/store/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.storeBackend | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
