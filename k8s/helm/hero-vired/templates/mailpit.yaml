apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.mailpit }}
  labels:
    {{- include "hero-vired.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
spec:
  selector:
    app.kubernetes.io/component: mailpit
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: http
      port: 8025
      targetPort: 8025
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.mailpit }}
  labels:
    {{- include "hero-vired.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
spec:
  replicas: {{ .Values.replicas.mailpit }}
  selector:
    matchLabels:
      app.kubernetes.io/component: mailpit
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "hero-vired.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mailpit
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mailpit
          image: "{{ .Values.images.mailpit.repository }}:{{ .Values.images.mailpit.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.mailpit | nindent 12 }}
