apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.api }}-worker
  labels:
    {{- include "hero-vired.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicas.worker }}
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "hero-vired.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.images.database.repository }}:{{ .Values.images.database.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["sh", "-c", "until pg_isready -h {{ .Values.services.db }} -U $POSTGRES_USER -d $POSTGRES_DB; do sleep 1; done"]
          envFrom:
            - secretRef:
                name: {{ include "hero-vired.secretName" . }}
      containers:
        - name: worker
          image: "{{ .Values.images.worker.repository }}:{{ .Values.images.worker.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["python", "-m", "app.execution.worker"]
          securityContext:
            {{- toYaml .Values.backendContainerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Values.services.config }}
            - secretRef:
                name: {{ include "hero-vired.secretName" . }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
