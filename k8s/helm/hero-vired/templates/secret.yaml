apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hero-vired.secretName" . }}
  labels:
    {{- include "hero-vired.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  {{- if .Values.database.password }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  {{- end }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.database.user .Values.database.password .Values.services.db .Values.database.name | quote }}
  {{- if .Values.modelGateway.token }}
  MODEL_GATEWAY_TOKEN: {{ .Values.modelGateway.token | quote }}
  {{- end }}
  {{- if .Values.notification.gatewayToken }}
  NOTIFICATION_GATEWAY_TOKEN: {{ .Values.notification.gatewayToken | quote }}
  {{- end }}
