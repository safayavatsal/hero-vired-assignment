apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "hero-vired.fullname" . }}-test-connection"
  labels:
    {{- include "hero-vired.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget"]
      args: ["-qO-", "http://{{ .Values.services.frontend }}:8080/"]
