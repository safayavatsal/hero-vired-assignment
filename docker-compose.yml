services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oncall
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oncall"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/oncall
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"

  worker:
    build: ./backend
    environment:
      WORKER_POLL_INTERVAL: "1"
    command: python -m app.execution.worker
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8000:5173"
